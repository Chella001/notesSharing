<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (!sessionStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management Dashboard · Firebase</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <!-- Include centralized Firebase config -->
    <script src="firebase-config.js" type="module"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Notification Toast -->
    <div id="notification" class="notification">Data loaded successfully</div>

    <div class="dashboard">
        <!-- Sidebar - with working links -->
        <div class="sidebar">
            <div class="hospital-name">🏥Akshaya Clinic</div>
            <div class="sidebar-menu">
                <div class="menu-item active" data-section="dashboard">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </div>
                <div class="menu-item" onclick="window.location.href='newPatient.html'">
                    <i class="fas fa-user-injured"></i> Patients
                </div>
                <div class="menu-item" onclick="window.location.href='newDoctor.html'">
                    <i class="fas fa-user-md"></i> Doctors
                </div>
                <div class="menu-item" onclick="window.location.href='appointments.html'">
                    <i class="fas fa-calendar-check"></i> Appointments
                </div>
               <div class="menu-item" onclick="window.location.href='reports.html'">
    <i class="fas fa-chart-bar"></i> Reports
</div>
                 <div class="menu-item" onclick="window.location.href='settings.html'">
                    <i class="fas fa-cog"></i> Settings
                </div>
                <div class="menu-item logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="main-header">
                <h1>Hospital Dashboard</h1>
                <div class="date-badge" id="currentDate"></div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Patients <span><i class="fas fa-users"></i></span></div>
                    <div class="stat-number" id="totalPatients">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Doctors <span><i class="fas fa-stethoscope"></i></span></div>
                    <div class="stat-number" id="totalDoctors">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Appointments <span><i class="fas fa-clock"></i></span></div>
                    <div class="stat-number" id="totalAppointments">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Revenue <span><i class="fas fa-indian-rupee-sign"></i></span></div>
                    <div class="stat-number revenue-number" id="totalRevenue">₹0</div>
                </div>
            </div>

            <!-- Recent Appointments Section -->
            <div class="section-header">
                <div class="recent-title">📋 Recent Appointments</div>
                <div>
                    <span class="view-all" onclick="loadDashboardData()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </span>
                </div>
            </div>

            <!-- Appointments Table -->
            <div id="appointmentsTableContainer">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Patient Name</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Fee</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody">
                        <tr>
                            <td colspan="6" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Loading appointments...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let db, auth;
        // ==================== HELPER FUNCTIONS ====================
        function showNotification(message, type = "success") {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.background = type === "success" ? "var(--primary)" : "var(--danger)";
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            if (date.toDate) {
                const d = date.toDate();
                return d.toLocaleDateString('en-GB');
            }
            return date;
        }

        function formatTime(date) {
            if (!date) return 'N/A';
            if (date.toDate) {
                const d = date.toDate();
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
            return '--:--';
        }

        // Set current date
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        // ==================== LOAD DASHBOARD DATA ====================
        async function loadDashboardData() {
            try {
                // Check if we came from any of the add pages
                const urlParams = new URLSearchParams(window.location.search);
                
                // Show appropriate notification
                if (urlParams.get('newPatient') === 'success') {
                    showNotification("✅ New patient added successfully! Count updated.", "success");
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else if (urlParams.get('newDoctor') === 'success') {
                    showNotification("✅ New doctor added successfully! Count updated.", "success");
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else if (urlParams.get('newAppointment') === 'success') {
                    showNotification("✅ New appointment scheduled successfully! Count updated.", "success");
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else {
                    showNotification("Loading dashboard data...", "success");
                }
                
                // Load Patients Count
                const patientsSnapshot = await db.collection('patients').get();
                const totalPatients = patientsSnapshot.size;
                document.getElementById('totalPatients').textContent = totalPatients;
                console.log("Total patients:", totalPatients);

                // Load Doctors Count
                const doctorsSnapshot = await db.collection('doctors').get();
                const totalDoctors = doctorsSnapshot.size;
                document.getElementById('totalDoctors').textContent = totalDoctors;
                console.log("Total doctors:", totalDoctors);

                // Load Appointments Count
                const appointmentsSnapshot = await db.collection('appointments').get();
                const totalAppointments = appointmentsSnapshot.size;
                document.getElementById('totalAppointments').textContent = totalAppointments;
                console.log("Total appointments:", totalAppointments);

                // Calculate Revenue
                let totalRevenue = 0;
                appointmentsSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.status === 'Completed' && data.fee) {
                        totalRevenue += data.fee;
                    }
                });
                document.getElementById('totalRevenue').textContent = `₹${totalRevenue.toLocaleString()}`;

                // Load Recent Appointments (last 5)
                const recentAppointmentsQuery = await db.collection('appointments')
                    .orderBy('date', 'desc')
                    .limit(5)
                    .get();
                
                // Display Appointments
                const appointmentsBody = document.getElementById('appointmentsBody');
                appointmentsBody.innerHTML = '';

                if (recentAppointmentsQuery.empty) {
                    appointmentsBody.innerHTML = '<tr><td colspan="6" class="no-data">📭 No appointments found.</td></tr>';
                } else {
                    recentAppointmentsQuery.forEach(doc => {
                        const apt = doc.data();
                        const row = document.createElement('tr');
                        
                        // Format date properly
                        let dateStr = 'N/A';
                        if (apt.date) {
                            if (apt.date.toDate) {
                                dateStr = apt.date.toDate().toLocaleDateString('en-GB');
                            } else if (apt.date instanceof Date) {
                                dateStr = apt.date.toLocaleDateString('en-GB');
                            } else {
                                dateStr = apt.date;
                            }
                        }
                        
                        // Determine status class
                        let statusClass = 'pending';
                        if (apt.status) {
                            statusClass = apt.status.toLowerCase().replace(' ', '-');
                        }
                        
                        row.innerHTML = `
                            <td><strong>${apt.patientName || 'Unknown'}</strong></td>
                            <td>${apt.doctorName || 'Unknown'}</td>
                            <td>${dateStr}</td>
                            <td>${apt.time || '10:00 AM'}</td>
                            <td><span class="status ${statusClass}">${apt.status || 'Pending'}</span></td>
                            <td><strong>${window.currencySymbol || '₹'}${apt.fee?.toLocaleString() || '0'}</strong></td>
                        `;
                        appointmentsBody.appendChild(row);
                    });
                }

            } catch (error) {
                console.error("❌ Error loading data:", error);
                
                // Show error but keep existing values if any
                if (document.getElementById('totalPatients').textContent === '0') {
                    document.getElementById('totalPatients').textContent = '⚠️';
                }
                if (document.getElementById('totalDoctors').textContent === '0') {
                    document.getElementById('totalDoctors').textContent = '⚠️';
                }
                if (document.getElementById('totalAppointments').textContent === '0') {
                    document.getElementById('totalAppointments').textContent = '⚠️';
                }
                
                document.getElementById('appointmentsBody').innerHTML = 
                    `<tr><td colspan="6" class="error">❌ Error loading appointments. Please check your connection.</td></tr>`;
                
                showNotification("Error loading data: " + error.message, "error");
            }
        }

        // ==================== AUTO-LOGIN ANONYMOUSLY ====================
        function autoLogin() {
            auth.signInAnonymously()
                .then(() => {
                    console.log("✅ Signed in anonymously");
                })
                .catch(error => {
                    console.log("Anonymous sign-in error:", error);
                    // Continue anyway - might be using public rules
                });
        }

        // ==================== MENU INTERACTIONS ====================
        document.querySelectorAll('.menu-item:not(.logout)').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(mi => {
                    mi.classList.remove('active');
                });
                this.classList.add('active');
                
                // Don't show navigation notification for items with direct links
                if (!this.hasAttribute('onclick')) {
                    const section = this.getAttribute('data-section');
                    if (section) {
                        showNotification(`Navigating to ${section} section`, "success");
                    }
                }
            });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(() => {
                    sessionStorage.clear();
                    showNotification("Logged out successfully");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }).catch(error => {
                    showNotification("Error logging out: " + error.message, "error");
                });
            }
        });

        // ==================== INITIAL LOAD ====================
        document.addEventListener('DOMContentLoaded', () => {
            db = window.db;
            auth = window.auth;
            // Try anonymous login (won't break if it fails)
            autoLogin();
            
            // Load dashboard data
            loadDashboardData();
            
            // Set up real-time listeners for auto-update
            if (db) {
                // Listen for patients changes
                db.collection('patients').onSnapshot((snapshot) => {
                    console.log("Patients collection changed, updating count...");
                    document.getElementById('totalPatients').textContent = snapshot.size;
                }, (error) => {
                    console.log("Patient listener error (ignored):", error);
                });
                
                // Listen for doctors changes
                db.collection('doctors').onSnapshot((snapshot) => {
                    console.log("Doctors collection changed, updating count...");
                    document.getElementById('totalDoctors').textContent = snapshot.size;
                }, (error) => {
                    console.log("Doctor listener error (ignored):", error);
                });
                
                // Listen for appointments changes
                db.collection('appointments').onSnapshot((snapshot) => {
                    console.log("Appointments collection changed, updating count...");
                    document.getElementById('totalAppointments').textContent = snapshot.size;
                    
                    // Also update revenue when appointments change
                    let totalRevenue = 0;
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.status === 'Completed' && data.fee) {
                            totalRevenue += data.fee;
                        }
                    });
                    const symbol = window.currencySymbol || '₹';
                    document.getElementById('totalRevenue').textContent = `${symbol}${totalRevenue.toLocaleString()}`;
                    
                    // Refresh the recent appointments table
                    loadDashboardData();
                }, (error) => {
                    console.log("Appointment listener error (ignored):", error);
                });
            }
        });
    </script>
</body>
</html>
