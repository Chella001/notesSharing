<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management · Appointments List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: 260px 1fr;
            overflow: hidden;
        }

        .sidebar {
            background: linear-gradient(180deg, #f8fafd 0%, #f0f4fa 100%);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #d9e1ea;
        }

        .hospital-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0b2b4b;
            margin-bottom: 40px;
            padding-left: 8px;
            background: linear-gradient(135deg, #0b2b4b 0%, #1e4b6e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 16px;
            color: #2c3e5c;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .menu-item i {
            width: 24px;
            font-size: 1.2rem;
            color: #4a627a;
        }

        .menu-item.active {
            background: white;
            border-color: #cbd5e1;
            box-shadow: 0 4px 12px rgba(0, 40, 80, 0.08);
            color: #0a2942;
            font-weight: 600;
        }

        .menu-item.active i {
            color: #1e4b6e;
        }

        .menu-item:hover:not(.logout) {
            background: rgba(255, 255, 255, 0.7);
            border-color: #cbd5e1;
        }

        .logout {
            margin-top: auto;
            color: #b13e3e;
            border-top: 1px solid #d0ddeb;
            padding-top: 20px;
            margin-top: 20px;
            border-radius: 0;
        }

        .logout i {
            color: #b13e3e;
        }

        .logout:hover {
            background: #fee9e9;
            border-color: #f5c2c2;
        }

        .main-content {
            background: white;
            padding: 28px 30px 32px 30px;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .main-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0c2d4b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .date-badge {
            background: #f0f5fc;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            color: #2c4c6e;
            font-weight: 500;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 2;
            position: relative;
        }

        .search-input i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8fa3bc;
        }

        .search-input input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid #e2ebf6;
            border-radius: 16px;
            font-size: 14px;
            background: #f8fcff;
            outline: none;
        }

        .search-input input:focus {
            border-color: #1e4b6e;
        }

        .filter-select {
            padding: 12px 16px;
            border: 1.5px solid #e2ebf6;
            border-radius: 16px;
            font-size: 14px;
            background: #f8fcff;
            outline: none;
            cursor: pointer;
        }

        .add-btn {
            background: #1e4b6e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: #0d3250;
        }

        .stats-badge {
            background: #f0f5fc;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #2c4c6e;
            display: inline-block;
            margin-bottom: 16px;
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 20, 40, 0.06);
        }

        .appointments-table th {
            text-align: left;
            padding: 16px;
            background-color: #f8fbfe;
            font-weight: 600;
            font-size: 13px;
            color: #34597a;
            border-bottom: 1px solid #dde5f0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .appointments-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #ecf1f7;
            color: #1f3b58;
            font-size: 14px;
        }

        .appointments-table tbody tr:hover {
            background-color: #fafdff;
            cursor: pointer;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-Completed { background: #e2f3e4; color: #1d6f2e; }
        .status-Scheduled { background: #e1f0fa; color: #1e4b6e; }
        .status-Confirmed { background: #d1e7dd; color: #0a5e3c; }
        .status-Pending { background: #fff6dd; color: #aa7130; }
        .status-Cancelled { background: #fee9e9; color: #b34040; }
        .status-In-Progress { background: #fff3cd; color: #856404; }
        .status-No-Show { background: #e0e0e0; color: #666; }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .edit-btn, .delete-btn, .view-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .edit-btn { color: #1e4b6e; }
        .edit-btn:hover { background: #e1f0fa; }
        .delete-btn { color: #b34040; }
        .delete-btn:hover { background: #fee9e9; }
        .view-btn { color: #2c7da0; }
        .view-btn:hover { background: #e1f0fa; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2ebf6;
        }

        .modal-header h3 {
            font-size: 20px;
            color: #0c2d4b;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8fa3bc;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c4c6e;
            margin-bottom: 6px;
        }

        .modal-field input, .modal-field select, .modal-field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2ebf6;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .modal-field input:focus, .modal-field select:focus {
            border-color: #1e4b6e;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e2ebf6;
        }

        .save-edit-btn {
            background: #1e4b6e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
        }

        .cancel-edit-btn {
            background: #f4f7fc;
            color: #4f6b8a;
            border: 1px solid #d9e1ea;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid #e2ebf6;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn.active {
            background: #1e4b6e;
            color: white;
            border-color: #1e4b6e;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e4b6e;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1001;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 800px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .appointments-table {
                font-size: 12px;
            }
            .appointments-table th, .appointments-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div id="notification" class="notification"></div>

    <div class="dashboard">
        <div class="sidebar">
            <div class="hospital-name">🏥 Akshaya Clinic</div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </div>
                <div class="menu-item" onclick="window.location.href='newPatient.html'">
                    <i class="fas fa-user-injured"></i> Patients
                </div>
                <div class="menu-item" onclick="window.location.href='newDoctor.html'">
                    <i class="fas fa-user-md"></i> Doctors
                </div>
                <div class="menu-item active">
                    <i class="fas fa-calendar-check"></i> Appointments
                </div>
                <div class="menu-item" onclick="window.location.href='reports.html'">
                    <i class="fas fa-chart-bar"></i> Reports
                </div>
                <div class="menu-item" onclick="window.location.href='settings.html'">
                    <i class="fas fa-cog"></i> Settings
                </div>
                <div class="menu-item logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="main-header">
                <h1><i class="fas fa-calendar-alt" style="color: #1e4b6e;"></i> Appointments Management</h1>
                <div class="date-badge" id="currentDate"></div>
            </div>

            <div class="search-bar">
                <div class="search-input">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by patient name or doctor name...">
                </div>
                <select id="statusFilter" class="filter-select">
                    <option value="">All Status</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                    <option value="No Show">No Show</option>
                </select>
                <input type="date" id="dateFilter" class="filter-select" style="width: auto;">
                <button class="add-btn" onclick="window.location.href='appointments.html'">
                    <i class="fas fa-plus"></i> New Appointment
                </button>
            </div>

            <div>
                <span class="stats-badge" id="appointmentCount">Total: 0 appointments</span>
            </div>

            <div style="overflow-x: auto;">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Fee</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody">
                        <tr>
                            <td colspan="8" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Loading appointments...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Update Appointment</h3>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editAppointmentId">
                <div class="modal-field">
                    <label>Status</label>
                    <select id="editStatus" required>
                        <option value="Scheduled">Scheduled</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="No Show">No Show</option>
                    </select>
                </div>
                <div class="modal-field">
                    <label>Payment Status</label>
                    <select id="editPaymentStatus">
                        <option value="Pending">Pending</option>
                        <option value="Paid">Paid</option>
                        <option value="Insurance">Insurance</option>
                    </select>
                </div>
                <div class="modal-field">
                    <label>Consultation Fee (₹)</label>
                    <input type="number" id="editFee" min="0" step="100" required>
                </div>
                <div class="modal-field">
                    <label>Notes / Remarks</label>
                    <textarea id="editNotes" rows="2" placeholder="Add any notes about this appointment..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-edit-btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="save-edit-btn">Update Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-calendar-check"></i> Appointment Details</h3>
                <button class="close-modal" onclick="closeViewModal()">&times;</button>
            </div>
            <div id="viewDetails"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMmDlzMavatvqE9-gKW4V6nPAV4U5CzDo",
            authDomain: "notessharingapp-fc388.firebaseapp.com",
            projectId: "notessharingapp-fc388",
            storageBucket: "notessharingapp-fc388.firebasestorage.app",
            messagingSenderId: "64602136432",
            appId: "1:64602136432:web:6e32abecc2bc9ec98179b5"
        };

        let db, auth;
        let allAppointments = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        auth.signInAnonymously().catch(e => console.log("Anon sign-in:", e));

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

        function showNotification(msg, type = "success") {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.style.background = type === "success" ? "#1e4b6e" : "#b34040";
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 2800);
        }

        async function loadAppointments() {
            try {
                const snapshot = await db.collection('appointments').orderBy('date', 'desc').get();
                allAppointments = [];
                snapshot.forEach(doc => {
                    let apt = { id: doc.id, ...doc.data() };
                    if (apt.date && apt.date.toDate) {
                        apt.dateObj = apt.date.toDate();
                        apt.dateStr = apt.dateObj.toISOString().split('T')[0];
                    }
                    allAppointments.push(apt);
                });
                filterAndDisplay();
            } catch (error) {
                console.error("Error loading appointments:", error);
                document.getElementById('appointmentsBody').innerHTML = '<td><td colspan="8" class="error">Error loading appointments</td></tr>';
            }
        }

        function filterAndDisplay() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            
            let filtered = allAppointments.filter(apt => 
                (apt.patientName?.toLowerCase().includes(searchTerm) ||
                apt.doctorName?.toLowerCase().includes(searchTerm)) &&
                (statusFilter === "" || apt.status === statusFilter) &&
                (dateFilter === "" || apt.dateStr === dateFilter)
            );
            
            displayAppointments(filtered);
            document.getElementById('appointmentCount').innerText = `Showing: ${filtered.length} of ${allAppointments.length} appointments`;
        }

        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsBody');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageAppointments = appointments.slice(start, end);

            if (pageAppointments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">No appointments found</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = '';
            pageAppointments.forEach(apt => {
                const row = document.createElement('tr');
                const dateStr = apt.dateStr || (apt.date ? new Date(apt.date).toLocaleDateString('en-GB') : 'N/A');
                row.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${apt.time || 'N/A'}</td>
                    <td><strong>${apt.patientName || 'N/A'}</strong></td>
                    <td>${apt.doctorName || 'N/A'}</td>
                    <td>${apt.type || 'Consultation'}</td>
                    <td><span class="status status-${(apt.status || 'Scheduled').replace(' ', '-')}">${apt.status || 'Scheduled'}</span></td>
                    <td class="fee-amount">₹${apt.fee?.toLocaleString() || 0}</td>
                    <td class="action-btns">
                        <button class="view-btn" onclick="viewAppointment('${apt.id}')" title="View Details"><i class="fas fa-eye"></i></button>
                        <button class="edit-btn" onclick="editAppointment('${apt.id}')" title="Update Status"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" onclick="deleteAppointment('${apt.id}', '${apt.patientName}')" title="Cancel"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            const totalPages = Math.ceil(appointments.length / itemsPerPage);
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    displayAppointments(appointments);
                };
                paginationDiv.appendChild(btn);
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            filterAndDisplay();
        });
        
        document.getElementById('statusFilter').addEventListener('change', () => {
            currentPage = 1;
            filterAndDisplay();
        });
        
        document.getElementById('dateFilter').addEventListener('change', () => {
            currentPage = 1;
            filterAndDisplay();
        });

        async function viewAppointment(id) {
            const apt = allAppointments.find(a => a.id === id);
            if (!apt) return;
            
            const modal = document.getElementById('viewModal');
            const detailsDiv = document.getElementById('viewDetails');
            const dateStr = apt.dateStr || (apt.date ? new Date(apt.date).toLocaleString() : 'N/A');
            
            detailsDiv.innerHTML = `
                <div class="modal-field"><label>Patient Name</label><p><strong>${apt.patientName || 'N/A'}</strong></p></div>
                <div class="modal-field"><label>Doctor Name</label><p>${apt.doctorName || 'N/A'}</p></div>
                <div class="modal-field"><label>Appointment Date & Time</label><p>${dateStr} at ${apt.time || 'N/A'}</p></div>
                <div class="modal-field"><label>Appointment Type</label><p>${apt.type || 'Consultation'}</p></div>
                <div class="modal-field"><label>Status</label><p><span class="status status-${(apt.status || 'Scheduled').replace(' ', '-')}">${apt.status || 'Scheduled'}</span></p></div>
                <div class="modal-field"><label>Consultation Fee</label><p class="fee-amount">₹${apt.fee?.toLocaleString() || 0}</p></div>
                <div class="modal-field"><label>Payment Status</label><p>${apt.paymentStatus || 'Pending'}</p></div>
                <div class="modal-field"><label>Reason / Symptoms</label><p>${apt.symptoms || 'Not specified'}</p></div>
                <div class="modal-field"><label>Additional Notes</label><p>${apt.additionalNotes || 'None'}</p></div>
            `;
            modal.classList.add('show');
        }

        async function editAppointment(id) {
            const apt = allAppointments.find(a => a.id === id);
            if (!apt) return;
            
            document.getElementById('editAppointmentId').value = apt.id;
            document.getElementById('editStatus').value = apt.status || 'Scheduled';
            document.getElementById('editPaymentStatus').value = apt.paymentStatus || 'Pending';
            document.getElementById('editFee').value = apt.fee || 0;
            document.getElementById('editNotes').value = apt.additionalNotes || '';
            
            document.getElementById('editModal').classList.add('show');
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editAppointmentId').value;
            
            const updatedData = {
                status: document.getElementById('editStatus').value,
                paymentStatus: document.getElementById('editPaymentStatus').value,
                fee: parseInt(document.getElementById('editFee').value),
                additionalNotes: document.getElementById('editNotes').value,
                updatedAt: new Date().toISOString()
            };
            
            try {
                await db.collection('appointments').doc(id).update(updatedData);
                showNotification("Appointment updated successfully!");
                closeEditModal();
                loadAppointments();
            } catch (error) {
                showNotification("Error updating appointment: " + error.message, "error");
            }
        });

        async function deleteAppointment(id, patientName) {
            if (confirm(`Cancel appointment for ${patientName}? This action cannot be undone.`)) {
                try {
                    await db.collection('appointments').doc(id).delete();
                    showNotification(`Appointment for ${patientName} has been cancelled`);
                    loadAppointments();
                } catch (error) {
                    showNotification("Error cancelling appointment: " + error.message, "error");
                }
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('show');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Log out from hospital system?')) {
                auth.signOut().then(() => {
                    showNotification("Logged out");
                    setTimeout(() => window.location.href = 'index.html', 1200);
                });
            }
        });

        loadAppointments();
    </script>
</body>
</html>
