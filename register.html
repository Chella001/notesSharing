<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management · Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
</head>

<body>
  <div class="register-container">
    <div class="register-card">
      <div class="hospital-badge">
        <i class="fas fa-hospital-user"></i>
        <h1 class="hospital-name">🏥 Hospital Name</h1>
        <p>Management System</p>
      </div>

      <div class="welcome-text">
        <h2 class="text-h2">Create Account</h2>
        <p>Register as a new staff member</p>
      </div>

      <form onsubmit="return handleRegister(event)">
        <div class="input-group">
          <label class="ds-label">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="fullname" placeholder="Enter your full name" required class="ds-input">
          </div>
        </div>

        <div class="input-group">
          <label class="ds-label">Department</label>
          <div class="input-wrapper">
            <i class="fas fa-building"></i>
            <select id="department" required class="ds-select">
              <option value="">Select Department</option>
              <option>Cardiology</option>
              <option>Pediatrics</option>
              <option>Orthopedics</option>
              <option>Neurology</option>
              <option>Gynecology</option>
              <option>General Medicine</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label class="ds-label">Email Address</label>
          <div class="input-wrapper">
            <i class="far fa-envelope"></i>
            <input type="email" id="email" placeholder="doctor@hospital.com" required class="ds-input">
          </div>
        </div>

        <div class="input-group">
          <label class="ds-label">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Create a password" required class="ds-input">
          </div>
        </div>

        <button type="submit" class="ds-btn ds-btn-primary full-width">
          <i class="fas fa-user-plus"></i>
          Register
        </button>

        <div id="errorMessage" class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          <span></span>
        </div>
      </form>

      <div class="login-section">
        <p>Already have an account?</p>
        <a href="index.html" class="login-link">
          Sign In <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Include centralized Firebase config -->
  <script src="js/firebase-config.js" type="module"></script>

  <script type="module">
    window.handleRegister = async function (event) {
      event.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const department = document.getElementById("department").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("errorMessage");
      const errorSpan = errorDiv.querySelector('span');

      errorDiv.classList.remove('show');

      // Basic validation
      if (!department) {
        errorSpan.textContent = "Please select a department";
        errorDiv.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorSpan.textContent = "Password must be at least 6 characters";
        errorDiv.classList.add('show');
        return;
      }

      try {
        const auth = window.auth;
        if (!auth) {
          throw new Error("Authentication service is initializing. Please try again.");
        }
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);

        await userCredential.user.updateProfile({
          displayName: fullname
        });

        // Store additional user data
        sessionStorage.setItem('userName', fullname);
        sessionStorage.setItem('userEmail', email);
        sessionStorage.setItem('userDepartment', department);

        alert("✓ Registration Successful! Please login.");
        window.location.href = "index.html";

      } catch (error) {
        let errorMessage = "Registration failed";

        if (error.code === 'auth/email-already-in-use') {
          errorMessage = "Email already in use";
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = "Invalid email format";
        } else if (error.code === 'auth/weak-password') {
          errorMessage = "Password too weak";
        } else {
          errorMessage = error.message;
        }

        errorSpan.textContent = errorMessage;
        errorDiv.classList.add('show');
      }
    };
  </script>
</body>

</html>
