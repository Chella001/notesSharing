<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management · Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="hospital-badge">
        <i class="fas fa-hospital-user"></i>
        <h1>🏥 Hospital Name</h1>
        <p>Management System</p>
      </div>

      <div class="welcome-text">
        <h2>Create Account</h2>
        <p>Register as a new staff member</p>
      </div>

      <form onsubmit="return handleRegister(event)">
        <div class="input-group">
          <label class="input-label">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Department</label>
          <div class="input-wrapper">
            <i class="fas fa-building"></i>
            <select id="department" required>
              <option value="">Select Department</option>
              <option>Cardiology</option>
              <option>Pediatrics</option>
              <option>Orthopedics</option>
              <option>Neurology</option>
              <option>Gynecology</option>
              <option>General Medicine</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Email Address</label>
          <div class="input-wrapper">
            <i class="far fa-envelope"></i>
            <input type="email" id="email" placeholder="doctor@hospital.com" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Create a password" required>
          </div>
        </div>

        <button type="submit" class="register-btn">
          <i class="fas fa-user-plus"></i>
          Register
        </button>

        <div id="errorMessage" class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          <span></span>
        </div>
      </form>

      <div class="login-section">
        <p>Already have an account?</p>
        <a href="index.html" class="login-link">
          Sign In <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Include centralized Firebase config -->
  <script src="firebase-config.js" type="module"></script>

  <!-- Remove redundant Firebase initialization -->
  <script>
  // Remove Firebase initialization block
  </script>
</body>
</html>
