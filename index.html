<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="hospital-badge">
        <i class="fas fa-hospital-user"></i>
        <h1 class="text-h1">🏥 Akshaya Clinic</h1>
        <p>Management System</p>
      </div>

      <form class="ds-form" onsubmit="return handleLogin(event)">
        <div class="input-group">
          <label class="ds-label">Email Address</label>
          <div class="input-wrapper">
            <i class="far fa-envelope"></i>
            <input type="email" id="email" placeholder="doctor@hospital.com" value="" class="ds-input">
          </div>
        </div>

        <div class="input-group">
          <label class="ds-label">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password" value="" class="ds-input">
            <button type="button" class="password-toggle" id="togglePassword" onclick="togglePasswordVisibility()" tabindex="-1">
              <i class="far fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#">
            <i class="fas fa-question-circle"></i> Forgot password?
          </a>
        </div>

        <button type="submit" class="ds-btn-primary full-width">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>

        <div id="errorMessage" class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          <span></span>
        </div>
      </form>

      <div class="register-section">
        <p>New here?</p>
        <a href="register.html" class="register-link">
          Create Account <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Global function for password toggle
    window.togglePasswordVisibility = function() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMmDlzMavatvqE9-gKW4V6nPAV4U5CzDo",
      authDomain: "notessharingapp-fc388.firebaseapp.com",
      projectId: "notessharingapp-fc388",
      storageBucket: "notessharingapp-fc388.firebasestorage.app",
      messagingSenderId: "64602136432",
      appId: "1:64602136432:web:6e32abecc2bc9ec98179b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("errorMessage");
      const errorSpan = errorDiv.querySelector('span');

      errorDiv.classList.remove('show');

      // Enhanced Validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email.trim())) {
        errorSpan.textContent = "Please enter a valid email address";
        errorDiv.classList.add('show');
        return;
      }

      if (!password || password.trim() === '') {
        errorSpan.textContent = "Please enter your password";
        errorDiv.classList.add('show');
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          sessionStorage.setItem('currentUser', user.email);
          sessionStorage.setItem('userEmail', user.email);
          sessionStorage.setItem('userName', email.split('@')[0]);
          
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          let errorMessage = "Invalid email or password";
          
          if (error.code === 'auth/user-not-found') {
            errorMessage = "No account found";
          } else if (error.code === 'auth/wrong-password') {
            errorMessage = "Incorrect password";
          } else if (error.code === 'auth/invalid-email') {
            errorMessage = "Invalid email format";
          } else if (error.code === 'auth/too-many-requests') {
            errorMessage = "Too many attempts";
          }
          
          errorSpan.textContent = errorMessage;
          errorDiv.classList.add('show');
        });
    };
  </script>
</body>
</html>
